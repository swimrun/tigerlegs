<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1058px;height:838px;background:#FFFFFF;" width="1058px" height="838px" viewBox="0 0 1058 838" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="353.94" y="33.535" fill="#000" font-size="14" textLength="348.585" font-weight="700">Decision tree: back-end technology (ADR-0014)</text></g><rect x="13" y="50.488" width="1027.466" height="16.641" fill="#FFC" style="stroke:#FD8;stroke-width:3;" rx="2.5" ry="2.5"/><text x="20" y="61.129" fill="#000" font-size="10" textLength="1017.466" font-family="monospace">This syntax is deprecated and the color is ignored: write ':Decision: Node.js with TypeScript; &lt;&lt;#palegreen>>' instead of '#palegreen:Decision: Node.js with TypeScript;'</text><ellipse cx="356.147" cy="84.129" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="223.279" y="114.129" width="265.736" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="233.279" y="135.73" fill="#000" font-size="12" textLength="245.736">Ten alternatives and ten weighted criteria,</text><text x="233.279" y="149.863" fill="#000" font-size="12" textLength="213.346">fixed before the scores were filled in</text><polygon points="220.919,182.395,491.375,182.395,503.375,195.35,491.375,208.305,220.919,208.305,208.919,195.35,220.919,182.395" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="220.919" y="193.029" fill="#000" font-size="11" textLength="270.456">Knock-out: self-hostable in the EU on a small VPS,</text><text x="220.919" y="205.984" fill="#000" font-size="11" textLength="225.736">open-source licence, a supported release?</text><text x="148.242" y="193.029" fill="#000" font-size="11" textLength="60.677">all ten pass</text><text x="503.375" y="193.029" fill="#000" font-size="11" textLength="22.086">fails</text><rect x="16" y="218.305" width="365.838" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="239.906" fill="#000" font-size="12" textLength="246.457">Weighted sum, with the owner's C1 scores</text><text x="26" y="254.039" fill="#000" font-size="12" textLength="294.445">Node.js 400, Spring Boot 365, Go 360, Axum 360,</text><text x="26" y="268.172" fill="#000" font-size="12" textLength="345.838">ASP.NET Core 355, Deno 350, Micronaut 340, Quarkus 340</text><rect x="457.007" y="218.305" width="112.736" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="467.007" y="239.906" fill="#000" font-size="12" textLength="92.736">Drop the option</text><polygon points="356.147,286.703,368.147,298.703,356.147,310.703,344.147,298.703,356.147,286.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="268.389,330.703,443.905,330.703,455.905,350.136,443.905,369.568,268.389,369.568,256.389,350.136,268.389,330.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="268.389" y="341.338" fill="#000" font-size="11" textLength="167.578">Is the lead larger than the error</text><text x="268.389" y="354.293" fill="#000" font-size="11" textLength="135.867">of the provisional scores?</text><text x="268.389" y="367.248" fill="#000" font-size="11" textLength="175.517">35 points is under two C1 points</text><text x="238.906" y="347.815" fill="#000" font-size="11" textLength="17.483">yes</text><text x="455.905" y="347.815" fill="#000" font-size="11" textLength="13.583">no</text><rect x="34.679" y="379.568" width="125.439" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="44.679" y="401.17" fill="#000" font-size="12" textLength="105.439">Choose the leader</text><rect x="362.112" y="379.568" width="505.566" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="372.112" y="401.17" fill="#000" font-size="12" textLength="232.471">Spike: measure C3 and C2 in containers</text><text x="372.112" y="415.303" fill="#000" font-size="12" textLength="485.566">Node.js 29 MiB idle, Spring Boot 173 MiB, Micronaut 135 MiB, ASP.NET Core 20 MiB</text><text x="372.112" y="429.436" fill="#000" font-size="12" textLength="205.758">backoff tests pass in all four stacks</text><polygon points="525.477,461.967,704.313,461.967,716.313,473.967,704.313,485.967,525.477,485.967,513.477,473.967,525.477,461.967" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="525.477" y="478.124" fill="#000" font-size="11" textLength="178.836">Does the spike overturn the lead?</text><text x="499.894" y="471.646" fill="#000" font-size="11" textLength="13.583">no</text><text x="716.313" y="471.646" fill="#000" font-size="11" textLength="17.483">yes</text><rect x="285.557" y="495.967" width="354.248" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="295.557" y="517.568" fill="#000" font-size="12" textLength="233.807">Sensitivity: which weight change flips it?</text><text x="295.557" y="531.701" fill="#000" font-size="12" textLength="334.248">C4 (shared code) at 0 gives Spring Boot 395, Node.js 380</text><polygon points="389.951,564.232,535.411,564.232,547.411,576.232,535.411,588.232,389.951,588.232,377.951,576.232,389.951,564.232" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="389.951" y="580.39" fill="#000" font-size="11" textLength="145.46">Is that weighting plausible?</text><text x="190.119" y="573.912" fill="#000" font-size="11" textLength="187.833">no, server-side analysis stays open</text><text x="547.411" y="573.912" fill="#000" font-size="11" textLength="17.483">yes</text><rect x="258.441" y="598.232" width="214.695" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="268.441" y="619.834" fill="#000" font-size="12" textLength="194.695">Decision: Node.js with TypeScript</text><rect x="493.136" y="598.232" width="132.875" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="503.136" y="619.834" fill="#000" font-size="12" textLength="112.875">Revisit: Spring Boot</text><polygon points="462.681,638.365,474.681,650.365,462.681,662.365,450.681,650.365,462.681,638.365" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="659.805" y="495.967" width="214.607" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="669.805" y="517.568" fill="#000" font-size="12" textLength="194.607">Take the better-measured option</text><polygon points="614.895,668.365,626.895,680.365,614.895,692.365,602.895,680.365,614.895,668.365" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="356.147,698.365,368.147,710.365,356.147,722.365,344.147,710.365,356.147,698.365" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="254.445" y="742.365" width="203.404" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="264.445" y="763.967" fill="#000" font-size="12" textLength="183.404">Record, with the revisit triggers</text><ellipse cx="356.147" cy="807.498" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="356.147" cy="807.498" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="356.147" y1="94.129" x2="356.147" y2="114.129" style="stroke:#181818;stroke-width: