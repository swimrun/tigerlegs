<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="RoARR, a robotic tiger with a headset">
  <circle cx="100" cy="100" r="98" fill="#10151B" stroke="#FFC700" stroke-width="4"/>
  <!-- ears -->
  <polygon points="30,74 32,26 70,46" fill="#F28C1B" stroke="#0B0E12" stroke-width="5" stroke-linejoin="miter"/>
  <polygon points="170,74 168,26 130,46" fill="#F28C1B" stroke="#0B0E12" stroke-width="5" stroke-linejoin="miter"/>
  <polygon points="40,64 40,42 58,52" fill="#0B0E12"/>
  <polygon points="160,64 160,42 142,52" fill="#0B0E12"/>
  <!-- head, cut like armour plates -->
  <polygon points="100,26 142,40 172,72 178,116 160,160 128,186 100,192 72,186 40,160 22,116 28,72 58,40" fill="#F28C1B" stroke="#0B0E12" stroke-width="5" stroke-linejoin="miter"/>
  <!-- forehead stripes -->
  <polygon points="100,30 92,60 100,54 108,60" fill="#0B0E12"/>
  <polygon points="66,44 84,70 70,68" fill="#0B0E12"/>
  <polygon points="134,44 116,70 130,68" fill="#0B0E12"/>
  <polygon points="24,96 48,104 26,112" fill="#0B0E12"/>
  <polygon points="176,96 152,104 174,112" fill="#0B0E12"/>
  <polygon points="30,128 54,128 34,142" fill="#0B0E12"/>
  <polygon points="170,128 146,128 166,142" fill="#0B0E12"/>
  <!-- white cheek fur -->
  <polygon points="30,116 70,126 64,164 42,150" fill="#F6F1E7"/>
  <polygon points="170,116 130,126 136,164 158,150" fill="#F6F1E7"/>
  <!-- circuit trace on the forehead: a route with nodes -->
  <polyline points="100,58 100,72 88,80 76,80" fill="none" stroke="#2DD4FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="100,72 112,80 124,80" fill="none" stroke="#39D98A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="80" r="3" fill="#2DD4FF"/>
  <circle cx="124" cy="80" r="3" fill="#39D98A"/>
  <!-- muzzle -->
  <polygon points="78,138 122,138 114,168 100,176 86,168" fill="#F6F1E7" stroke="#0B0E12" stroke-width="4" stroke-linejoin="miter"/>
  <polygon points="88,132 112,132 100,146" fill="#0B0E12"/>
  <polyline points="100,146 100,156 90,162 M100,156 110,162" fill="none" stroke="#0B0E12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- eyes, narrowed and looking straight at you -->
  <polygon points="42,100 90,94 86,112 48,116" fill="#0B0E12"/>
  <polygon points="158,100 110,94 114,112 152,116" fill="#0B0E12"/>
  <ellipse cx="70" cy="105" rx="9" ry="7" fill="#39FF88"/>
  <ellipse cx="130" cy="105" rx="9" ry="7" fill="#39FF88"/>
  <ellipse cx="70" cy="105" rx="2.5" ry="6" fill="#0B0E12"/>
  <ellipse cx="130" cy="105" rx="2.5" ry="6" fill="#0B0E12"/>
  <circle cx="73" cy="102" r="1.8" fill="#FFFFFF"/>
  <circle cx="133" cy="102" r="1.8" fill="#FFFFFF"/>
  <!-- headset: slim band, ear cups with a cyan ring, and a mic boom -->
  <path d="M24 100 C24 24 176 24 176 100" fill="none" stroke="#0B0E12" stroke-width="8" stroke-linecap="round"/>
  <polygon points="8,92 30,86 36,132 14,138" fill="#232B34" stroke="#0B0E12" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="192,92 170,86 164,132 186,138" fill="#232B34" stroke="#0B0E12" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="22" cy="112" r="6" fill="none" stroke="#2DD4FF" stroke-width="3"/>
  <circle cx="178" cy="112" r="6" fill="none" stroke="#2DD4FF" stroke-width="3"/>
  <path d="M16 138 C24 176 56 188 80 182" fill="none" stroke="#0B0E12" stroke-width="4" stroke-linecap="round"/>
  <circle cx="84" cy="182" r="6" fill="#232B34" stroke="#0B0E12" stroke-width="3"/>
  <circle cx="84" cy="182" r="2.5" fill="#2DD4FF"/>
</svg>
