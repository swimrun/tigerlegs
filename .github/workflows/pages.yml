name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit shipped dependencies
        run: npm run audit:prod
      - name: Test
        run: npm test
      - name: Test the Node.js back end
        run: npm run test:server
      - name: Check the back end compiles with only Node's types
        run: npm run check:server
      - name: Check that shared modules stay portable
        run: npm run check:shared
      - name: Build site
        run: deno task build
      - name: Check site types
        run: npm run check
      - name: Install browser for site tests
        run: npx playwright install --with-deps chromium
      - name: Test static pages and React extractor
        run: npm run test:site
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
