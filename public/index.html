<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TigerLegs</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <meta property="og:title" content="TigerLegs">
  <meta property="og:image" content="/img/tigerlegs-promo.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    #map { height: 420px; margin: 1rem 0; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 4px 10px; text-align: left; }
    tr.active { background: #fff3cd; }
    #message { color: #b00020; }
  </style>
</head>
<body>
  <h1>TigerLegs</h1>
  <label>Upload a .gpx file: <input id="gpx-input" type="file" accept=".gpx"></label>
  <p id="message" role="alert"></p>
  <div id="map"></div>
  <p id="totals"></p>
  <table id="segments">
    <thead><tr><th>#</th><th>Type</th><th>Distance</th><th>Detected by</th><th>Confidence</th></tr></thead>
    <tbody></tbody>
  </table>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
